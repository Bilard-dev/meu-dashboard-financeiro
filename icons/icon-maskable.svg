<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="barGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadowMask" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Full background for maskable -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Financial Chart Symbol scaled within 70% safe area -->
  <g transform="translate(51, 51) scale(0.8)" filter="url(#shadowMask)" fill="url(#barGradMask)">
    <!-- Bar 1 (left) -->
    <rect x="116" y="270" width="60" height="130" rx="14"/>
    <!-- Bar 2 (middle) -->
    <rect x="210" y="200" width="60" height="200" rx="14"/>
    <!-- Bar 3 (right) -->
    <rect x="304" y="140" width="60" height="260" rx="14"/>
    <!-- Trending arrow line -->
    <path d="M116 230 L220 150 L290 190 L390 90" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M340 90 L390 90 L390 140" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
