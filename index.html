<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financeiro Pessoal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --invest: #8b5cf6;
            --border: #e2e8f0;
            --table-header-bg: #f8fafc;
            --tag-bg: #f1f5f9;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --border: #334155;
            --table-header-bg: #0f172a;
            --tag-bg: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 1.5rem; min-height: 100vh; }
        header { margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        header h1 { font-size: 1.75rem; font-weight: 700; }
        .header-controls { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
        .action-btn { background: var(--card-bg); border: 1px solid var(--border); padding: 0.6rem 0.9rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
        .nav-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; }
        .tab-btn { padding: 0.6rem 1.2rem; border-radius: 8px; border: none; background: transparent; color: var(--text-muted); font-size: 0.95rem; font-weight: 600; cursor: pointer; }
        .tab-btn.active { background-color: var(--primary); color: #ffffff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .select-container select { padding: 0.6rem 1rem; border-radius: 8px; border: 1px solid var(--border); background-color: var(--card-bg); color: var(--text-main); font-size: 0.95rem; font-weight: 600; }
        
        .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; margin-bottom: 1.5rem; }
        .kpi-card { background: var(--card-bg); padding: 1.25rem 1.5rem; border-radius: 12px; border: 1px solid var(--border); }
        .kpi-title { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.4rem; }
        .kpi-value { font-size: 1.5rem; font-weight: 700; }

        .chart-card { background: var(--card-bg); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .chart-title { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
        .data-table th, .data-table td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .data-table th { background-color: var(--table-header-bg); color: var(--text-muted); }
        .reset-btn { background-color: var(--tag-bg); color: var(--primary); border: 1px solid var(--border); padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .loading { text-align: center; font-size: 1.1rem; color: var(--primary); padding: 3rem; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Painel Financeiro</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Gestão Patrimonial Pessoal</p>
        </div>
        <div class="header-controls">
            <button class="action-btn" onclick="goLancamento()">📝 Lançar Gasto</button>
            <button class="action-btn" onclick="toggleTheme()" id="themeBtn">🌙 Modo Escuro</button>
            <button class="action-btn" onclick="loadDashboardData()">🔄 Sincronizar</button>
            <div class="select-container">
                <select id="monthSelector"><option value="all">Todo o Histórico</option></select>
            </div>
        </div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('resumo')">Resumo Geral</button>
        <button class="tab-btn" onclick="switchTab('investimentos')">Investimentos</button>
    </div>

    <div id="loading" class="loading">Carregando dados...</div>

    <div id="dashboard" style="display: none;">
        <div id="tab-resumo" class="tab-content active">
            <div class="kpi-container">
                <div class="kpi-card"><div class="kpi-title">Receitas</div><div class="kpi-value" id="kpi-receitas" style="color: var(--success);">R$ 0,00</div></div>
                <div class="kpi-card"><div class="kpi-title">Despesas</div><div class="kpi-value" id="kpi-despesas" style="color: var(--danger);">R$ 0,00</div></div>
                <div class="kpi-card"><div class="kpi-title">Aportes</div><div class="kpi-value" id="kpi-investimentos" style="color: var(--invest);">R$ 0,00</div></div>
                <div class="kpi-card"><div class="kpi-title">Sobra</div><div class="kpi-value" id="kpi-saldo">R$ 0,00</div></div>
            </div>

            <div class="chart-card">
                <div class="chart-title">Composição de Gastos</div>
                <div style="width:100%; max-width:380px; margin: 0 auto;"><canvas id="categoryChart"></canvas></div>
            </div>

            <div class="chart-card">
                <div class="chart-title">Extrato de Lançamentos</div>
                <div style="max-height: 400px; overflow-y: auto;">
                    <table class="data-table">
                        <thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Categoria</th><th>Valor</th></tr></thead>
                        <tbody id="resumoExtratoTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="tab-investimentos" class="tab-content">
            <div class="kpi-container">
                <div class="kpi-card"><div class="kpi-title">Total Investido</div><div class="kpi-value" id="kpi-patrimonio-total" style="color: var(--invest);">R$ 0,00</div></div>
            </div>
            <div class="chart-card">
                <div class="chart-title">Histórico de Aportes</div>
                <table class="data-table">
                    <thead><tr><th>Data</th><th>Descrição</th><th>Subcategoria</th><th>Categoria</th><th>Valor</th></tr></thead>
                    <tbody id="investTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gzjzvswfwjoqrcfvlowi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6anp2c3dmd2pvcXJjZnZsb3dpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NzcwOTgsImV4cCI6MjEwMjA1MzA5OH0.vHzFz9_UzrSYGrPIqa1rOxTU0zpB1LUe_sqw8Y7Z23s';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const currentUser = urlParams.get('user') === 'vic' ? 'vic' : 'bilard';

        let globalData = [];
        let categoryChart = null;

        function goLancamento() {
            window.location.href = currentUser === 'vic' ? 'lancamento.html?user=vic' : 'lancamento.html';
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeBtn').innerText = isDark ? '☀️ Modo Claro' : '🌙 Modo Escuro';
        }

        function fmt(val) {
            return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        async function loadDashboardData() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';

            try {
                const { data, error } = await _supabase
                    .from('lancamentos')
                    .select('*')
                    .eq('user_id', currentUser)
                    .order('data', { ascending: false });

                if (error) throw error;

                globalData = data.map(item => {
                    const p = item.data.split('-');
                    const dateObj = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));

                    return {
                        id: item.id,
                        type: String(item.tipo || 'DESPESA').toUpperCase().trim(),
                        date: dateObj,
                        desc: item.descricao || '',
                        category: item.categoria || 'Outros',
                        subCat: item.subcategoria || '',
                        value: parseFloat(item.valor) || 0,
                        month: dateObj.getMonth(),
                        year: dateObj.getFullYear()
                    };
                });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

                setupMonthSelector();
                updateDashboard(document.getElementById('monthSelector').value);

            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerText = "Erro ao carregar dados do Supabase: " + error.message;
            }
        }

        function setupMonthSelector() {
            const select = document.getElementById('monthSelector');
            select.innerHTML = '<option value="all">Todo o Histórico</option>';
            const months = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
            
            const activeMonths = [...new Set(globalData.map(d => `${d.year}-${d.month}`))].sort();
            activeMonths.forEach(ym => {
                const [y, m] = ym.split('-');
                const opt = document.createElement('option');
                opt.value = ym; 
                opt.textContent = `${months[m]} ${y}`;
                select.appendChild(opt);
            });
            
            select.onchange = (e) => updateDashboard(e.target.value);
        }

        function updateDashboard(selectedYm) {
            const filtered = selectedYm === 'all' ? globalData : globalData.filter(d => `${d.year}-${d.month}` === selectedYm);

            const receitas = filtered.filter(d => d.type === 'RECEITA').reduce((a, b) => a + b.value, 0);
            const despesas = filtered.filter(d => d.type === 'DESPESA').reduce((a, b) => a + b.value, 0);
            const invest = filtered.filter(d => d.type === 'INVESTIMENTO').reduce((a, b) => a + b.value, 0);
            const saldo = receitas - despesas - invest;

            document.getElementById('kpi-receitas').innerText = fmt(receitas);
            document.getElementById('kpi-despesas').innerText = fmt(despesas);
            document.getElementById('kpi-investimentos').innerText = fmt(invest);
            document.getElementById('kpi-saldo').innerText = fmt(saldo);
            document.getElementById('kpi-patrimonio-total').innerText = fmt(invest);

            renderExtrato(filtered);
            renderChart(filtered);
            renderInvestments();
        }

        function renderExtrato(dataArr) {
            const tbody = document.getElementById('resumoExtratoTableBody');
            tbody.innerHTML = '';
            
            if (dataArr.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:1rem; color:var(--text-muted);">Nenhum lançamento encontrado.</td></tr>';
                return;
            }

            dataArr.forEach(item => {
                const tr = document.createElement('tr');
                let color = item.type === 'DESPESA' ? 'var(--danger)' : item.type === 'RECEITA' ? 'var(--success)' : 'var(--invest)';
                tr.innerHTML = `
                    <td>${item.date.toLocaleDateString('pt-BR')}</td>
                    <td style="font-weight:700; color:${color};">${item.type}</td>
                    <td>${item.desc || '-'}</td>
                    <td>${item.category}</td>
                    <td style="font-weight:700; color:${color};">${fmt(item.value)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderInvestments() {
            const tbody = document.getElementById('investTableBody');
            tbody.innerHTML = '';
            const investData = globalData.filter(d => d.type === 'INVESTIMENTO');

            investData.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.date.toLocaleDateString('pt-BR')}</td>
                    <td>${item.desc}</td>
                    <td>${item.subCat || '-'}</td>
                    <td>${item.category}</td>
                    <td style="color:var(--invest); font-weight:700;">${fmt(item.value)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderChart(filteredData) {
            if (categoryChart) categoryChart.destroy();

            const despesas = filteredData.filter(d => d.type === 'DESPESA');
            const catMap = {};
            despesas.forEach(d => { catMap[d.category] = (catMap[d.category] || 0) + d.value; });

            categoryChart = new Chart(document.getElementById('categoryChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catMap),
                    datasets: [{
                        data: Object.values(catMap),
                        backgroundColor: ['#2563eb', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4']
                    }]
                },
                options: { responsive: true }
            });
        }

        window.onload = loadDashboardData;
    </script>
</body>
</html>
