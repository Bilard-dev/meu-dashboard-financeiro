<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Financeiro · Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1220;--panel:#141b2e;--panel2:#1a2338;--line:#232d46;--text:#e8ecf6;--muted:#8591ad;--green:#4cc38a;--red:#ef6f6c;--violet:#9d8cff;--blue:#4f8cff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:#080c18;color:var(--text);font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);padding:0 16px calc(100px + env(safe-area-inset-bottom))}
.hide .money{filter:blur(8px);user-select:none}

/* topo */
.top{display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-right:auto}
.ib{width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.ib:active{background:var(--line)}
.month{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.month button{height:46px;display:grid;place-items:center;color:var(--muted)}
.month .ml{font-weight:700;text-align:center;font-size:16px}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}
.hero{padding:18px 18px 16px}
.lbl{color:var(--muted);font-size:13px;font-weight:600}
.big{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-top:2px}
.bar{height:8px;background:var(--line);border-radius:99px;margin:14px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px}
.sub{color:var(--muted);font-size:13px}.sub b{color:var(--text);font-weight:700}
.rows{margin-top:10px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px}
.sr+.sr{border-top:1px solid var(--line)}
.sr .n{font-weight:700;display:flex;align-items:center;gap:8px}
.sr .n:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.sr .s{color:var(--muted);font-size:12.5px;margin:1px 0 0 16px}
.sr .v{font-size:18px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;color:var(--c)}
.green{--c:var(--green)}.red{--c:var(--red)}.violet{--c:var(--violet)}

/* próximos meses */
.uph,.hh{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
h2{font-size:17px;font-weight:800}
.uph a{color:var(--blue);font-weight:700;font-size:13.5px;cursor:pointer}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.cm{flex:none;scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 14px;white-space:nowrap}
.cm span{color:var(--muted);font-size:12.5px;font-weight:600;display:block}
.cm b{color:var(--red);font-weight:800}

/* lançamentos */
.hh{margin-top:26px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:14px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 14px;color:var(--muted)}
.search svg{width:18px;height:18px}
.search input{flex:1;background:none;border:0;padding:12px 0;min-width:0}
.search input::placeholder{color:#5d6a88}.search input:focus{outline:none}
.dayh{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;padding:16px 2px 8px;color:var(--muted);font-size:13px;font-weight:700}
.dayh span.pos{color:var(--green)}
.group{overflow:hidden}
.row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:12px 14px;min-height:62px}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:#ffffff08}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.d{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;min-width:0;margin-top:1px}
.m .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{flex:none;background:var(--line);color:var(--text);font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px}
.val{font-weight:800;white-space:nowrap;color:var(--c)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}

/* barra inferior */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;z-index:20;background:#101729f2;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:700;padding:6px 0;text-align:center}
.tab.on{color:var(--blue)}
.fab{width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 8px 22px #4f8cff55,0 0 0 6px var(--bg)}
.fab svg{width:28px;height:28px;stroke-width:2.4}

/* sheet + toast */
.sbg{position:fixed;inset:0;background:#000a;z-index:40;display:none;align-items:end;justify-content:center}
.sbg.open{display:flex}
.sheet{width:100%;max-width:430px;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grip{width:38px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sh{padding:2px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.sh b{display:block;font-size:16px}.sh span{color:var(--muted);font-size:13px}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:14px 6px;font-weight:700;font-size:16px;border-radius:10px}
.act:active{background:var(--line)}.act.del{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;gap:16px;align-items:center;font-weight:600;z-index:60;transition:.2s;max-width:92vw}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{color:var(--blue);font-weight:800}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
 <header class="top">
  <h1>Painel Financeiro</h1>
  <button class="ib" id="eye" aria-label="Ocultar valores"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button class="ib" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
 </header>
 <div class="month">
  <button id="prev" aria-label="Mês anterior"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <div class="ml" id="ml">Novembro 2026</div>
  <button id="next" aria-label="Próximo mês"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
 </div>

 <section class="card hero">
  <div class="lbl">Sobra do mês</div>
  <div class="big money" id="sobra"></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="sub" id="gasto"></div>
 </section>

 <section class="card rows">
  <div class="sr green"><div><div class="n">Receitas</div><div class="s" id="recS"></div></div><div class="v money" id="rec"></div></div>
  <div class="sr red"><div><div class="n">Despesas</div><div class="s money" id="despS"></div></div><div class="v money" id="desp"></div></div>
  <div class="sr violet"><div><div class="n">Aportes</div><div class="s" id="apoS"></div></div><div class="v money" id="apo"></div></div>
 </section>

 <div class="uph"><h2>Próximos meses</h2><a id="prev2">Ver previsão ›</a></div>
 <div class="strip">
  <div class="cm"><span>Dez</span><b class="money">R$ 877,73</b></div>
  <div class="cm"><span>Jan</span><b class="money">R$ 306,16</b></div>
  <div class="cm"><span>Fev</span><b class="money">R$ 240,54</b></div>
  <div class="cm"><span>Mar</span><b class="money">R$ 120,00</b></div>
 </div>

 <div class="hh"><h2>Lançamentos</h2></div>
 <div class="chips" id="chips">
  <button class="chip on" data-f="all">Todos</button><button class="chip" data-f="cartao">Cartão</button><button class="chip" data-f="pix">PIX</button><button class="chip" data-f="entrada">Entradas</button><button class="chip" data-f="aporte">Aportes</button>
 </div>
 <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Buscar descrição ou tag…"></label>
 <div id="list"></div>
</div>

<nav class="tabbar">
 <button class="tab on" data-n="Início"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Início</button>
 <button class="tab" data-n="Faturas"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>Faturas</button>
 <button class="fab" id="fab" aria-label="Novo registro"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
 <button class="tab" data-n="Investimentos"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Investimentos</button>
 <button class="tab" id="more"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Mais</button>
</nav>

<div class="sbg" id="sbg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><span id="tt"></span><button id="undo">Desfazer</button></div>

<script>
const $=s=>document.querySelector(s);
const COL={Transporte:'#4f8cff','Alimentação':'#f0b84a','Gastos voluntários':'#9d8cff',Presentes:'#ef6f6c','Cantina DAXV':'#4cc38a','Saúde':'#ff8fb1','Educação':'#b0e06a','Assinaturas':'#c58cff',Barbearia:'#3ec1d3','Banco Inter':'#9d8cff','Banco do Brasil':'#9d8cff','Salário':'#4cc38a',Reembolso:'#4cc38a'};
let id=0;
const T=(d,desc,cat,sub,m,k,v)=>({id:++id,d:'2026-11-'+d,desc,cat,sub,m,k,v});
let tx=[
 T('20','LCI 89% banco inter','Banco Inter','','PIX','aporte',2000),
 T('19','Investimento casal','Banco do Brasil','Investimento Casal','PIX','aporte',150),
 T('19','Carona APMBB vic','Transporte','Viagem APMBB','PIX','despesa',19),
 T('18','Mercado','Alimentação','Mercado','PIX','despesa',42.64),
 T('18','Lanche','Alimentação','Lanche','PIX','despesa',21.15),
 T('15','Farmácia','Saúde','','PIX','despesa',122.36),
 T('13','Passagem passaro marron','Transporte','','PIX','despesa',42.35),
 T('13','Charlie movel carro alugado','Gastos voluntários','','PIX','despesa',8),
 T('12','Farmácia','Saúde','','ML CRÉDITO','despesa',94),
 T('12','Reembolso','Reembolso','','PIX','entrada',156.29),
 T('11','Garrafa Stanley presente vic','Presentes','','PIX','despesa',88.26),
 T('10','Cantina DAXV','Cantina DAXV','','PIX','despesa',72.9),
 T('09','Barbearia Jacson','Barbearia','','PIX','despesa',20),
 T('08','Mercado do bairro','Alimentação','Mercado','PIX','despesa',253.99),
 T('07','Salário','Salário','','PIX','entrada',4587.71),
 T('07','Presente vic namoro Regata','Presentes','','PIX','entrada',100),
 T('07','Mercado mensal','Alimentação','Mercado','ML CRÉDITO','despesa',412),
 T('06','Jantar','Alimentação','Restaurante','ML CRÉDITO','despesa',189.6),
 T('03','Streaming','Assinaturas','','ML CRÉDITO','despesa',55.9),
 T('02','Curso online','Educação','','ML CRÉDITO','despesa',500)
];
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const sum=a=>a.reduce((s,t)=>s+t.v,0);
const WD=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const dayLbl=d=>{const x=new Date(d+'T12:00');return `${d.slice(8)}/${d.slice(5,7)} · ${WD[x.getDay()]}`};
let filter='all',query='',last=null,tm;

function summary(){
 const ent=tx.filter(t=>t.k==='entrada'),des=tx.filter(t=>t.k==='despesa'),apo=tx.filter(t=>t.k==='aporte');
 const r=sum(ent),d=sum(des),a=sum(apo),pct=r?d/r*100:0;
 $('#sobra').textContent=brl(r-d-a);
 $('#fill').style.width=Math.min(100,pct)+'%';
 $('#gasto').innerHTML=`Você gastou <b>${pct.toFixed(1)}%</b> da receita`;
 $('#rec').textContent=brl(r);$('#recS').textContent=`${ent.length} entradas`;
 $('#desp').textContent=brl(d);
 $('#despS').textContent=`Cartão ${brl(sum(des.filter(t=>t.m!=='PIX')))} · PIX ${brl(sum(des.filter(t=>t.m==='PIX')))}`;
 $('#apo').textContent=brl(a);$('#apoS').textContent=`${apo.length} operaç${apo.length===1?'ão':'ões'}`;
}
function list(){
 const q=query.toLowerCase();
 const rows=tx.filter(t=>(filter==='all'||(filter==='cartao'&&t.m!=='PIX')||(filter==='pix'&&t.m==='PIX')||t.k===filter)
  &&(!q||(t.desc+t.cat+t.sub).toLowerCase().includes(q))).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
 if(!rows.length){$('#list').innerHTML='<div class="empty">Nenhum lançamento encontrado.</div>';return}
 let h='';
 for(const g of [...new Set(rows.map(r=>r.d))]){
  const it=rows.filter(r=>r.d===g),net=it.reduce((s,t)=>s+(t.k==='entrada'?t.v:-t.v),0);
  h+=`<div class="dayh"><span>${dayLbl(g)}</span><span class="money ${net>0?'pos':''}">${net<0?'−':'+'} ${brl(Math.abs(net))}</span></div><div class="card group">`;
  for(const t of it){
   const c=t.k==='aporte'?'var(--violet)':(COL[t.cat]||'#8591ad');
   const vc=t.k==='entrada'?'var(--green)':t.k==='aporte'?'var(--violet)':'var(--red)';
   h+=`<button class="row" data-id="${t.id}"><div class="ic" style="--c:${c}">${t.cat.slice(0,2).toUpperCase()}</div>
    <div style="min-width:0"><div class="d">${t.desc}</div><div class="m"><span class="t">${t.cat}${t.sub?' · '+t.sub:''}</span>${t.m!=='PIX'?`<span class="tag">${t.m}</span>`:'<span class="tag">PIX</span>'}</div></div>
    <div class="val money" style="--c:${vc}">${t.k==='entrada'?'+ ':''}${brl(t.v)}</div></button>`;
  }
  h+='</div>';
 }
 $('#list').innerHTML=h;
}
const render=()=>{summary();list()};

/* sheet */
function sheet(html){$('#sheet').innerHTML='<div class="grip"></div>'+html;$('#sbg').classList.add('open')}
const closeSheet=()=>$('#sbg').classList.remove('open');
$('#sbg').addEventListener('click',e=>{if(e.target.id==='sbg')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
const I={edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',dup:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg>',del:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',go:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'};

$('#list').addEventListener('click',e=>{
 const r=e.target.closest('.row');if(!r)return;
 const t=tx.find(x=>x.id==r.dataset.id);
 sheet(`<div class="sh"><b>${t.desc}</b><span>${dayLbl(t.d)} · ${brl(t.v)}</span></div>
  <button class="act" data-a="edit">${I.edit}Editar</button><button class="act" data-a="dup">${I.dup}Duplicar</button><button class="act del" data-a="del">${I.del}Excluir</button>`);
 $('#sheet').dataset.id=t.id;
});
$('#sheet').addEventListener('click',e=>{
 const b=e.target.closest('.act');if(!b)return;
 if(b.dataset.go){closeSheet();toast(b.dataset.go+' (tela não incluída na prévia)',false);return}
 const i=tx.findIndex(x=>x.id==$('#sheet').dataset.id);if(i<0)return;const t=tx[i];
 closeSheet();
 if(b.dataset.a==='del'){last={t,i};tx.splice(i,1);render();toast('Lançamento excluído',true)}
 if(b.dataset.a==='dup'){tx.push({...t,id:++id});render();toast('Lançamento duplicado',false)}
 if(b.dataset.a==='edit')toast('Abre o formulário de edição',false);
});

/* toast */
function toast(m,u){$('#tt').textContent=m;$('#undo').style.display=u?'':'none';$('#toast').classList.add('show');clearTimeout(tm);tm=setTimeout(()=>$('#toast').classList.remove('show'),5000)}
$('#undo').onclick=()=>{if(last){tx.splice(last.i,0,last.t);last=null;render()}$('#toast').classList.remove('show')};

/* header, nav, filtros */
$('#eye').onclick=()=>$('#app').classList.toggle('hide');
const nav=(l,go)=>`<button class="act" data-go="${l}">${l}<span style="margin-left:auto;color:var(--muted)">${I.go}</span></button>`;
$('#menuBtn').onclick=()=>sheet(['Lançador celular','Sincronizar'].map(nav).join('')+'<button class="act del" data-go="Sair">Sair</button>');
$('#more').onclick=()=>sheet(['Análise de Gastos','Previsão Financeira','Categorias','Minha Conta','Central Admin'].map(nav).join(''));
$('#fab').onclick=()=>toast('Abre o formulário Novo Lançamento',false);
document.querySelectorAll('.tab[data-n]').forEach(b=>b.onclick=()=>{if(b.dataset.n!=='Início')toast(b.dataset.n+' (tela não incluída na prévia)',false)});
$('#prev2').onclick=()=>toast('Abre Previsão Financeira',false);
const M=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let mi=10,my=2026;const sm=d=>{mi+=d;if(mi<0){mi=11;my--}if(mi>11){mi=0;my++}$('#ml').textContent=M[mi]+' '+my};
$('#prev').onclick=()=>sm(-1);$('#next').onclick=()=>sm(1);
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;filter=b.dataset.f;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));list()};
$('#q').oninput=e=>{query=e.target.value;list()};
render();
</script>
</body>
</html>
