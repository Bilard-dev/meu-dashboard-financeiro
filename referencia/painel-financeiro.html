<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Financeiro</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1220;--panel:#141b2e;--panel2:#1a2338;--line:#232d46;--text:#e8ecf6;--muted:#8591ad;--green:#4cc38a;--red:#ef6f6c;--violet:#9d8cff;--blue:#4f8cff;--amber:#f0b84a;--radius:14px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;font-size:14px;line-height:1.45;padding:0 0 90px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.hide .money{filter:blur(7px);user-select:none}

/* header */
header{display:flex;align-items:center;gap:12px;padding:20px 0 14px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em;margin-right:auto}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.month{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.month button{padding:8px 11px;color:var(--muted);font-size:16px}
.month button:hover{color:var(--text)}
.month span{min-width:118px;text-align:center;font-weight:600}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--text)}
.btn{background:var(--blue);color:#fff;font-weight:700;padding:9px 16px;border-radius:10px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--panel2);color:var(--text)}
.menu{position:relative}
.menu-list{display:none;position:absolute;right:0;top:44px;z-index:20;min-width:210px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 30px #0008}
.menu.open .menu-list{display:block}
.menu-list button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px}
.menu-list button:hover{background:var(--line)}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.menu-list .danger{color:var(--red)}

/* tabs */
nav{display:flex;gap:6px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:22px;overflow-x:auto}
nav button{padding:9px 16px;color:var(--muted);font-weight:600;border-radius:10px;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button.on{background:var(--blue);color:#fff}
nav button.admin{color:var(--blue);border:1px dashed var(--blue)}
nav button.admin.on{background:var(--blue);color:#fff}

/* summary */
.summary{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.label{color:var(--muted);font-size:13px;font-weight:600}
.big{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.hero .big{font-size:34px}
.green{color:var(--green)}.red{color:var(--red)}.violet{color:var(--violet)}
.bar{height:8px;background:var(--line);border-radius:99px;margin:14px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .4s}
.sub{color:var(--muted);font-size:12.5px}
.sub b{color:var(--text);font-weight:600}

/* upcoming */
.upcoming{display:flex;align-items:center;gap:10px;margin:14px 0 26px;overflow-x:auto;padding-bottom:2px}
.upcoming>span{color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.chip-up{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;white-space:nowrap;font-size:13px}
.chip-up b{color:var(--red);margin-left:6px}
.upcoming a{margin-left:auto;color:var(--blue);font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer}

/* history */
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.tools h2{font-size:17px;font-weight:700;margin-right:auto}
.chips{display:flex;gap:6px}
.chip{padding:6px 13px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px}
.chip:hover{color:var(--text)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.search{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:200px}
.search::placeholder{color:var(--muted)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.day{display:flex;justify-content:space-between;padding:9px 18px;background:var(--panel2);color:var(--muted);font-size:12.5px;font-weight:600}
.row{display:grid;grid-template-columns:34px 1fr auto 76px;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line)}
.row:hover{background:#ffffff06}
.dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:800}
.desc{font-weight:600}
.meta{color:var(--muted);font-size:12.5px;display:flex;gap:8px;align-items:center}
.tag{background:var(--line);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;color:var(--text)}
.val{font-weight:700;text-align:right}
.acts{display:flex;gap:2px;justify-content:flex-end;opacity:0;transition:opacity .12s}
.row:hover .acts,.row:focus-within .acts{opacity:1}
.acts button{width:30px;height:30px;border-radius:8px;color:var(--muted)}
.acts button:hover{background:var(--line);color:var(--text)}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* fab, modal, toast */
.fab{display:none;position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;font-size:28px;box-shadow:0 8px 24px #0009;z-index:15}
.overlay{display:none;position:fixed;inset:0;background:#000a;z-index:30;place-items:center;padding:16px}
.overlay.open{display:grid}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:420px}
.modal h3{font-size:18px;margin-bottom:14px}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:14px}
.seg button{padding:8px;border-radius:7px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text)}
.field{display:block;margin-bottom:12px}
.field span{display:block;color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:5px}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.field input.amount{font-size:24px;font-weight:800;padding:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{color:var(--green);font-size:12px;margin:-6px 0 10px;min-height:16px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 16px;display:flex;gap:16px;align-items:center;transition:transform .25s;z-index:40;box-shadow:0 10px 30px #000a}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast button{color:var(--blue);font-weight:700}
.placeholder{padding:60px 20px;text-align:center;color:var(--muted)}

@media(max-width:820px){
 .summary{grid-template-columns:1fr 1fr}.hero{grid-column:1/-1}
 .fab{display:block}.btn.new{display:none}
 .search{width:100%;order:3}
 .row{grid-template-columns:34px 1fr auto}.acts{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app">
 <header>
  <div class="brand">Painel Financeiro<small>Gestão patrimonial pessoal</small></div>
  <div class="month"><button id="prev" aria-label="Mês anterior">‹</button><span id="monthLabel">Novembro 2026</span><button id="next" aria-label="Próximo mês">›</button></div>
  <button class="icon-btn" id="eye" title="Ocultar valores" aria-label="Ocultar valores">👁</button>
  <button class="btn new" id="openNew">+ Novo registro</button>
  <div class="menu" id="menu">
   <button class="icon-btn" id="menuBtn" aria-label="Menu da conta">☰</button>
   <div class="menu-list">
    <button>Lançador celular</button>
    <button>Sincronizar</button>
    <hr>
    <button class="danger">Sair</button>
   </div>
  </div>
 </header>

 <nav id="tabs">
  <button class="on" data-home="1">Resumo Geral</button><button>📊 Análise de Gastos</button><button>Parcelas / Fatura Cartão</button><button>🔮 Previsão Financeira</button><button>Investimentos</button><button>⚙️ Categorias</button><button>🔒 Minha Conta</button><button class="admin">🛡️ Central Admin</button>
 </nav>

 <main id="view">
  <section class="summary">
   <div class="card hero">
    <div class="label">Sobra do mês</div>
    <div class="big money" id="sobra">–</div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="sub" id="barTxt"></div>
   </div>
   <div class="card"><div class="label">Receitas</div><div class="big green money" id="rec">–</div><div class="sub" id="recSub"></div></div>
   <div class="card"><div class="label">Despesas</div><div class="big red money" id="desp">–</div><div class="sub" id="despSub"></div></div>
   <div class="card"><div class="label">Aportes</div><div class="big violet money" id="apo">–</div><div class="sub" id="apoSub"></div></div>
  </section>

  <div class="upcoming">
   <span>Próximos meses</span>
   <div class="chip-up">Dez<b class="money">R$ 536,64</b></div>
   <div class="chip-up">Jan<b class="money">R$ 263,65</b></div>
   <div class="chip-up">Fev<b class="money">R$ 240,54</b></div>
   <a>Ver previsão completa</a>
  </div>

  <div class="tools">
   <h2>Lançamentos</h2>
   <div class="chips" id="chips">
    <button class="chip on" data-f="all">Todos</button><button class="chip" data-f="cartao">Cartão</button><button class="chip" data-f="pix">PIX</button><button class="chip" data-f="entrada">Entradas</button>
   </div>
   <input class="search" id="q" placeholder="Buscar descrição ou tag…" aria-label="Buscar">
  </div>
  <div class="list" id="list"></div>
 </main>
 <div id="other" class="placeholder" style="display:none">Esta aba entra na próxima etapa do redesign.</div>
</div>

<button class="fab" id="fab" aria-label="Novo registro">+</button>

<div class="overlay" id="overlay">
 <div class="modal" role="dialog" aria-label="Novo registro">
  <h3>Novo registro</h3>
  <div class="seg" id="seg"><button class="on" data-t="pix">PIX</button><button data-t="cartao">Cartão</button><button data-t="entrada">Entrada</button></div>
  <label class="field"><span>Valor</span><input class="amount" id="fValor" inputmode="decimal" placeholder="0,00"></label>
  <label class="field"><span>Descrição</span><input id="fDesc" placeholder="Ex.: Cantina DAXV" autocomplete="off"></label>
  <div class="hint" id="hint"></div>
  <div class="two">
   <label class="field"><span>Categoria</span><select id="fCat"></select></label>
   <label class="field"><span>Data</span><input type="date" id="fData"></label>
  </div>
  <div class="actions"><button class="btn ghost" id="cancel">Cancelar</button><button class="btn" id="save">Salvar</button></div>
 </div>
</div>

<div class="toast" id="toast"><span id="toastTxt"></span><button id="undo">Desfazer</button></div>

<script>
const CATS={Transporte:'#4f8cff',Alimentação:'#f0b84a','Gastos voluntários':'#9d8cff',Presentes:'#ef6f6c','Cantina DAXV':'#4cc38a',Mercado:'#3ec1d3',Saúde:'#ff8fb1',Educação:'#b0e06a',Assinaturas:'#c58cff',Renda:'#4cc38a'};
const ABBR=c=>c.slice(0,2).toUpperCase();
let id=0;
const T=(data,desc,cat,tipo,valor)=>({id:++id,data,desc,cat,tipo,valor});
let tx=[
 T('2026-11-13','Passagem pássaro marrom','Transporte','pix',42.35),
 T('2026-11-13','Charlie móvel carro alugado','Gastos voluntários','pix',8),
 T('2026-11-13','Pão de metro aula de tiro','Gastos voluntários','pix',21.15),
 T('2026-11-12','Reembolso','Renda','entrada',400),
 T('2026-11-12','Farmácia','Saúde','cartao',94),
 T('2026-11-11','Garrafa Stanley presente vic','Presentes','pix',88.26),
 T('2026-11-10','Cantina DAXV','Cantina DAXV','pix',72.9),
 T('2026-11-09','Freelance','Renda','entrada',1244),
 T('2026-11-08','Mercado do bairro','Mercado','pix',253.99),
 T('2026-11-07','Mercado mensal','Mercado','cartao',412),
 T('2026-11-06','Jantar','Alimentação','cartao',189.6),
 T('2026-11-05','Salário','Renda','entrada',3200),
 T('2026-11-03','Streaming','Assinaturas','cartao',55.9),
 T('2026-11-02','Curso online','Educação','cartao',500)
];
const aportes=[];
let filter='all',query='',lastDeleted=null,toastTimer,tipo='pix';
const $=s=>document.querySelector(s);
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const sum=a=>a.reduce((s,t)=>s+t.valor,0);
const WD=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const fmtDay=d=>{const x=new Date(d+'T12:00');return `${String(x.getDate()).padStart(2,'0')}/${String(x.getMonth()+1).padStart(2,'0')} · ${WD[x.getDay()]}`};

function renderSummary(){
 const ent=tx.filter(t=>t.tipo==='entrada'),des=tx.filter(t=>t.tipo!=='entrada');
 const r=sum(ent),d=sum(des),a=sum(aportes);
 $('#rec').textContent=brl(r);$('#desp').textContent=brl(d);$('#apo').textContent=brl(a);
 $('#sobra').textContent=brl(r-d-a);
 const pct=r?Math.min(100,d/r*100):0;
 $('#barFill').style.width=pct+'%';
 $('#barTxt').innerHTML=`Você gastou <b>${pct.toFixed(1)}%</b> da receita`;
 $('#recSub').innerHTML=`${ent.length} entradas`;
 $('#despSub').innerHTML=`Cartão <b class="money">${brl(sum(des.filter(t=>t.tipo==='cartao')))}</b><br>PIX <b class="money">${brl(sum(des.filter(t=>t.tipo==='pix')))}</b>`;
 $('#apoSub').textContent=aportes.length?`${aportes.length} operações`:'Nenhum aporte neste mês';
}
function renderList(){
 const q=query.toLowerCase();
 const rows=tx.filter(t=>(filter==='all'||t.tipo===filter)&&(!q||(t.desc+t.cat+t.tipo).toLowerCase().includes(q)))
  .sort((a,b)=>b.data.localeCompare(a.data)||b.id-a.id);
 if(!rows.length){$('#list').innerHTML='<div class="empty">Nenhum lançamento encontrado. Ajuste o filtro ou toque em “Novo registro”.</div>';return}
 let html='',cur='';
 for(const g of [...new Set(rows.map(r=>r.data))]){
  const items=rows.filter(r=>r.data===g);
  const net=items.reduce((s,t)=>s+(t.tipo==='entrada'?t.valor:-t.valor),0);
  html+=`<div class="day"><span>${fmtDay(g)}</span><span class="money">${net<0?'−':'+'} ${brl(Math.abs(net))}</span></div>`;
  for(const t of items){
   const c=CATS[t.cat]||'#8591ad',ent=t.tipo==='entrada';
   html+=`<div class="row" data-id="${t.id}">
    <div class="dot" style="background:${c}22;color:${c}">${ABBR(t.cat)}</div>
    <div><div class="desc">${t.desc}</div><div class="meta">${t.cat}<span class="tag">${t.tipo==='cartao'?'CARTÃO':t.tipo.toUpperCase()}</span></div></div>
    <div class="val money ${ent?'green':'red'}">${ent?'+ ':''}${brl(t.valor)}</div>
    <div class="acts"><button data-a="edit" title="Editar">✎</button><button data-a="dup" title="Duplicar">⧉</button><button data-a="del" title="Excluir">🗑</button></div>
   </div>`;
  }
 }
 $('#list').innerHTML=html;
}
const render=()=>{renderSummary();renderList()};

/* list actions */
$('#list').addEventListener('click',e=>{
 const b=e.target.closest('button[data-a]');if(!b)return;
 const i=tx.findIndex(t=>t.id==b.closest('.row').dataset.id),t=tx[i];
 if(b.dataset.a==='del'){lastDeleted={t,i};tx.splice(i,1);render();showToast('Lançamento excluído')}
 if(b.dataset.a==='dup'){tx.push({...t,id:++id});render();showToast('Lançamento duplicado',false)}
 if(b.dataset.a==='edit'){openModal(t)}
});
let editing=null;

/* filters */
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;filter=b.dataset.f;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));renderList()});
$('#q').addEventListener('input',e=>{query=e.target.value;renderList()});

/* toast */
function showToast(msg,undo=true){
 $('#toastTxt').textContent=msg;$('#undo').style.display=undo?'':'none';
 $('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),5000);
}
$('#undo').onclick=()=>{if(lastDeleted){tx.splice(lastDeleted.i,0,lastDeleted.t);lastDeleted=null;render()}$('#toast').classList.remove('show')};

/* modal */
$('#fCat').innerHTML=Object.keys(CATS).map(c=>`<option>${c}</option>`).join('');
function setTipo(t){tipo=t;document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
$('#seg').onclick=e=>{const b=e.target.closest('button');if(b)setTipo(b.dataset.t)};
function openModal(t=null){
 editing=t;
 $('#fValor').value=t?String(t.valor).replace('.',','):'';
 $('#fDesc').value=t?t.desc:'';
 $('#fCat').value=t?t.cat:'Alimentação';
 $('#fData').value=t?t.data:new Date().toISOString().slice(0,10);
 $('#hint').textContent='';setTipo(t?t.tipo:'pix');
 $('.modal h3').textContent=t?'Editar registro':'Novo registro';
 $('#overlay').classList.add('open');setTimeout(()=>$('#fValor').focus(),30);
}
const closeModal=()=>$('#overlay').classList.remove('open');
$('#openNew').onclick=$('#fab').onclick=()=>openModal();
$('#cancel').onclick=closeModal;
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
$('#fDesc').addEventListener('input',e=>{
 const v=e.target.value.toLowerCase();if(v.length<3){$('#hint').textContent='';return}
 const m=[...tx].reverse().find(t=>t.desc.toLowerCase().includes(v));
 if(m){$('#fCat').value=m.cat;$('#hint').textContent=`Categoria sugerida: ${m.cat}`}
});
$('#save').onclick=()=>{
 const valor=parseFloat($('#fValor').value.replace(/\./g,'').replace(',','.'));
 const desc=$('#fDesc').value.trim();
 if(!valor||valor<=0){$('#fValor').focus();return}
 const o={data:$('#fData').value,desc:desc||'Sem descrição',cat:$('#fCat').value,tipo,valor};
 if(editing)Object.assign(editing,o);else tx.push({id:++id,...o});
 closeModal();render();showToast(editing?'Alterações salvas':'Registro salvo',false);
};
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeModal();$('#menu').classList.remove('open')}
 if(e.key==='Enter'&&$('#overlay').classList.contains('open')&&e.target.tagName!=='BUTTON')$('#save').click();
 if(['INPUT','SELECT'].includes(e.target.tagName))return;
 if(e.key==='n'||e.key==='N'){e.preventDefault();openModal()}
 if(e.key==='/'){e.preventDefault();$('#q').focus()}
});

/* header */
$('#eye').onclick=()=>$('#app').classList.toggle('hide');
$('#menuBtn').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('open')};
document.addEventListener('click',()=>$('#menu').classList.remove('open'));
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let mi=10,my=2026;
const setMonth=d=>{mi+=d;if(mi<0){mi=11;my--}if(mi>11){mi=0;my++}$('#monthLabel').textContent=`${MESES[mi]} ${my}`};
$('#prev').onclick=()=>setMonth(-1);$('#next').onclick=()=>setMonth(1);
$('#tabs').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;
 document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
 const home=!!b.dataset.home;
 $('#view').style.display=home?'':'none';$('#other').style.display=home?'none':'';
};
render();
</script>
</body>
</html>
